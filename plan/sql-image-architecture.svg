<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="983" viewBox="0 0 1680 1180" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1180" fill="#ffffff"/>

  <text x="40" y="52" font-size="26" font-weight="600" fill="#0f172a">SQL / SSRS / SSIS image build — three images, one remote host</text>
  <text x="40" y="80" font-size="14" fill="#475569">sql-image is delivered by the orchestrator on winhost-01; the sqlserver image is the mock EC2 AMI the emulator launches.</text>

  <rect x="40" y="110" width="460" height="730" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="60" y="140" font-size="17" font-weight="600" fill="#0f172a">WORKSTATION — C:\workspace\devops</text>

  <rect x="60" y="160" width="420" height="190" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="76" y="184" font-size="15" font-weight="600" fill="#0f172a">sql-image — delivery repository, task key SQLIMG</text>
  <text x="76" y="208" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">ci\host\: stage, docker build, provision-commit</text>
  <text x="76" y="230" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">src\sqlserver\: install steps, configs\assets.json</text>
  <text x="76" y="252" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">src\orchestrator\: build context for the orchestrator image</text>
  <text x="76" y="274" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">src\aws-emulator\: published Host, config, docker.exe</text>
  <text x="76" y="296" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">plan\: one milestone document at a time</text>
  <text x="76" y="318" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">orchestrator\: runtime and data, git-ignored</text>
  <text x="76" y="340" font-size="12" fill="#475569">Checks stay daemon-free: fake docker and WinRM seams.</text>

  <rect x="60" y="368" width="420" height="92" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="76" y="392" font-size="15" font-weight="600" fill="#0f172a">Media — already on the remote host, not referenced yet</text>
  <text x="76" y="416" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">SQL 2025 ISO, PowerBIReportServer.exe</text>
  <text x="76" y="438" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">one-time copy into host_bind_mount, marker-guarded</text>

  <rect x="60" y="478" width="420" height="104" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="76" y="502" font-size="15" font-weight="600" fill="#0f172a">Setup\winrm\uploads\sql</text>
  <text x="76" y="526" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">run-scripts.ps1 + scripts.json</text>
  <text x="76" y="548" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">localBaseFolder → devops, localFolders: sql</text>
  <text x="76" y="570" font-size="12" fill="#475569">Remote script: C:\workspace\sql\ci\ci.ps1</text>

  <rect x="60" y="600" width="420" height="92" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="76" y="624" font-size="15" font-weight="600" fill="#0f172a">devops\buildtools_docker</text>
  <text x="76" y="648" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">source of ci\host and src\buildtools</text>
  <text x="76" y="670" font-size="12.5" fill="#475569">moved into sql-image, renamed sqlserver</text>

  <rect x="60" y="710" width="420" height="110" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="76" y="734" font-size="15" font-weight="600" fill="#0f172a">aws-emulator</text>
  <text x="76" y="758" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">config\ec2.json: ami → sqlserver-instance</text>
  <text x="76" y="780" font-size="12.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">emulator repo, its own milestone delivery</text>
  <text x="76" y="802" font-size="12" fill="#475569">Owned by the emulator milestone, not this one.</text>

  <rect x="560" y="110" width="1080" height="730" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="580" y="140" font-size="17" font-weight="600" fill="#0f172a">REMOTE HOST winhost-01 — Windows container engine</text>

  <rect x="580" y="160" width="245" height="160" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="594" y="184" font-size="14" font-weight="600" fill="#0f172a">1. buildtools</text>
  <text x="594" y="208" font-size="12" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">buildtools:latest</text>
  <text x="594" y="230" font-size="12" fill="#334155">MSBuild, dotnet 10, git,</text>
  <text x="594" y="248" font-size="12" fill="#334155">pwsh, nuget, node</text>
  <text x="594" y="276" font-size="12" fill="#475569">Built once from</text>
  <text x="594" y="294" font-size="12" font-family="Cascadia Mono, Consolas, monospace" fill="#475569">uploads\buildtools</text>
  <text x="594" y="312" font-size="12" fill="#475569">Toolchain and orchestrator base</text>

  <rect x="845" y="160" width="245" height="160" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="859" y="184" font-size="14" font-weight="600" fill="#0f172a">2. orchestrator</text>
  <text x="859" y="208" font-size="12" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">FROM buildtools:latest</text>
  <text x="859" y="230" font-size="12" fill="#334155">compiled dlls, appsettings</text>
  <text x="859" y="248" font-size="12" fill="#334155">copilot runner, git</text>
  <text x="859" y="276" font-size="12" fill="#475569">No published port</text>
  <text x="859" y="294" font-size="12" fill="#475569">Drives the milestones</text>
  <text x="859" y="312" font-size="12" fill="#475569">Context populated in sql</text>

  <rect x="1110" y="160" width="245" height="160" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="1124" y="184" font-size="14" font-weight="600" fill="#0f172a">3. aws-emulator</text>
  <text x="1124" y="208" font-size="12" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">servercore:ltsc2025</text>
  <text x="1124" y="230" font-size="12" fill="#334155">published AwsEmulator.Host</text>
  <text x="1124" y="248" font-size="12" fill="#334155">config\, docker.exe</text>
  <text x="1124" y="276" font-size="12" fill="#475569">Listens on :5000</text>
  <text x="1124" y="294" font-size="12" fill="#475569">DOCKER_HOST relay to engine</text>
  <text x="1124" y="312" font-size="12" fill="#475569">Starts instance containers</text>

  <rect x="1375" y="160" width="245" height="160" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="1389" y="184" font-size="14" font-weight="600" fill="#0f172a">4. sqlserver-instance</text>
  <text x="1389" y="208" font-size="12" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">:&lt;version&gt;</text>
  <text x="1389" y="230" font-size="11" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">FROM framework/runtime</text>
  <text x="1389" y="248" font-size="11" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">4.8.1-windowsservercore-ltsc2025</text>
  <text x="1389" y="276" font-size="12" fill="#475569">SQL engine, SSIS, report server</text>
  <text x="1389" y="294" font-size="12" fill="#475569">Committed from the provision container</text>
  <text x="1389" y="312" font-size="12" fill="#475569">This is the mock AMI</text>

  <rect x="580" y="356" width="1015" height="128" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="596" y="380" font-size="15" font-weight="600" fill="#0f172a">docker compose stack — sql\ci\host\docker\docker-compose.yml</text>
  <rect x="596" y="394" width="470" height="74" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="610" y="416" font-size="13" font-weight="600" fill="#0f172a">service: orchestrator</text>
  <text x="610" y="436" font-size="11.5" fill="#334155">mounts sql repo, data, logs, secrets, engine npipe</text>
  <text x="610" y="456" font-size="11.5" fill="#334155">waits on the emulator healthcheck before its first sweep</text>
  <rect x="1090" y="394" width="489" height="74" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1104" y="416" font-size="13" font-weight="600" fill="#0f172a">service: aws-emulator</text>
  <text x="1104" y="436" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">ports: 5000:5000</text>
  <text x="1104" y="456" font-size="11.5" fill="#334155">nat network 172.31.0.0/24, fixed address</text>

  <rect x="580" y="508" width="1015" height="150" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="596" y="532" font-size="15" font-weight="600" fill="#0f172a">sqlserver provisioning — inside the uploaded folder, on the remote daemon</text>
  <rect x="596" y="546" width="300" height="96" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="610" y="568" font-size="12.5" font-weight="600" fill="#0f172a">thin image</text>
  <text x="610" y="588" font-size="11.5" fill="#334155">base + copied payload scripts</text>
  <text x="610" y="606" font-size="11.5" fill="#334155">media and repository bind-mounted</text>
  <text x="610" y="624" font-size="11.5" fill="#334155">never copied into a layer</text>
  <rect x="916" y="546" width="330" height="96" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="930" y="568" font-size="12.5" font-weight="600" fill="#0f172a">provision container</text>
  <text x="930" y="588" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">setup.exe /ACTION=Install</text>
  <text x="930" y="606" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">/FEATURES=SQLENGINE,FULLTEXT,IS,…</text>
  <text x="930" y="624" font-size="11.5" fill="#334155">then PBIRS /quiet Edition=DEV</text>
  <rect x="1266" y="546" width="313" height="96" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1280" y="568" font-size="12.5" font-weight="600" fill="#0f172a">probe, then freeze</text>
  <text x="1280" y="588" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">sqlservr.exe, MsDtsSrvr.exe,</text>
  <text x="1280" y="606" font-size="11.5" font-family="Cascadia Mono, Consolas, monospace" fill="#334155">ReportServer URL</text>
  <text x="1280" y="624" font-size="11.5" fill="#334155">stop, commit with explicit CMD</text>

  <rect x="580" y="682" width="1015" height="128" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="596" y="706" font-size="15" font-weight="600" fill="#0f172a">the emulated EC2 instance — started by the emulator, not by compose</text>
  <rect x="596" y="720" width="470" height="74" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="610" y="742" font-size="12.5" font-weight="600" fill="#0f172a">RunInstances with the mapped AMI</text>
  <text x="610" y="762" font-size="11.5" fill="#334155">user data configures SSRS against the launched database</text>
  <text x="610" y="780" font-size="11.5" fill="#334155">install stays in the image; configuration does not</text>
  <rect x="1090" y="720" width="489" height="74" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1104" y="742" font-size="12.5" font-weight="600" fill="#0f172a">proof, then teardown</text>
  <text x="1104" y="762" font-size="11.5" fill="#334155">GetConsoleOutput carries the SSIS and SSRS smoke line</text>
  <text x="1104" y="780" font-size="11.5" fill="#334155">TerminateInstances removes the container</text>

  <line x1="480" y1="530" x2="576" y2="530" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="486" y="522" font-size="11.5" font-weight="600" fill="#0f172a">upload, WinRM 5986</text>

  <line x1="480" y1="414" x2="530" y2="414" stroke="#334155" stroke-width="1.6"/>
  <line x1="530" y1="414" x2="530" y2="660" stroke="#334155" stroke-width="1.6"/>
  <line x1="530" y1="660" x2="576" y2="660" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="676" font-size="11.5" font-weight="600" fill="#0f172a">one-time copy, then mount</text>

  <line x1="702" y1="320" x2="702" y2="352" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="712" y="342" font-size="11.5" font-weight="600" fill="#0f172a">compose up</text>

  <line x1="958" y1="484" x2="958" y2="504" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="968" y="500" font-size="11.5" font-weight="600" fill="#0f172a">ci.ps1 stage</text>

  <line x1="1280" y1="642" x2="1280" y2="678" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1290" y="666" font-size="11.5" font-weight="600" fill="#0f172a">commit</text>

  <line x1="1335" y1="468" x2="1335" y2="506" stroke="#334155" stroke-width="1.6"/>
  <line x1="1335" y1="506" x2="1640" y2="506" stroke="#334155" stroke-width="1.6"/>
  <line x1="1640" y1="506" x2="1640" y2="716" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1350" y="498" font-size="11.5" font-weight="600" fill="#0f172a">RunInstances</text>

  <rect x="40" y="870" width="1600" height="270" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="60" y="900" font-size="17" font-weight="600" fill="#0f172a">Order of a delivery</text>

  <text x="60" y="932" font-size="13" fill="#334155">1</text>
  <text x="86" y="932" font-size="13" fill="#334155">Operator seeds the scaffold and drops one milestone document into orchestrator\data\requirements.</text>
  <text x="60" y="962" font-size="13" fill="#334155">2</text>
  <text x="86" y="962" font-size="13" fill="#334155">run-scripts.ps1 uploads sql-image to C:\workspace\sql over WinRM, then runs sql\ci\ci.ps1 there.</text>
  <text x="60" y="992" font-size="13" fill="#334155">3</text>
  <text x="86" y="992" font-size="13" fill="#334155">The pipeline builds buildtools from uploads\buildtools: provision container, probe, commit.</text>
  <text x="60" y="1022" font-size="13" fill="#334155">4</text>
  <text x="86" y="1022" font-size="13" fill="#334155">compose starts orchestrator, built from that image, beside aws-emulator on port 5000.</text>
  <text x="60" y="1052" font-size="13" fill="#334155">5</text>
  <text x="86" y="1052" font-size="13" fill="#334155">orchestrator plans feature\SQLIMG-n from develop; the agent edits in a worktree; the check runs fake-seam tests.</text>
  <text x="60" y="1082" font-size="13" fill="#334155">6</text>
  <text x="86" y="1082" font-size="13" fill="#334155">The check passes, both reviewers record against the sha, the branch merges into develop.</text>
  <text x="60" y="1112" font-size="13" fill="#334155">7</text>
  <text x="86" y="1112" font-size="13" fill="#334155">The sqlserver milestone builds its image on the remote daemon and commits the provisioned container.</text>

  <text x="880" y="932" font-size="13" fill="#334155">8</text>
  <text x="906" y="932" font-size="13" fill="#334155">The image is tagged sqlserver-instance:&lt;version&gt; and survives the prune of untagged images.</text>
  <text x="880" y="962" font-size="13" fill="#334155">9</text>
  <text x="906" y="962" font-size="13" fill="#334155">The emulator milestone maps that tag as the mock AMI in aws-emulator config\ec2.json.</text>
  <text x="880" y="992" font-size="13" fill="#334155">10</text>
  <text x="906" y="992" font-size="13" fill="#334155">RunInstances starts it as the EC2 instance; user data configures SSRS against the local database.</text>
  <text x="880" y="1022" font-size="13" fill="#334155">11</text>
  <text x="906" y="1022" font-size="13" fill="#334155">GetConsoleOutput must carry the smoke line before the deployment step exits zero.</text>
  <text x="880" y="1052" font-size="13" fill="#334155">12</text>
  <text x="906" y="1052" font-size="13" fill="#334155">TerminateInstances removes the container; the next milestone is written against the new develop.</text>
</svg>
